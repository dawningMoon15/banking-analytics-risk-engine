[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking_analytics"
version = "1.0.0"
description = "Banking Customer Analytics & Risk Engine"
readme = "README.md"
authors = [
    { name = "Navya Sharma" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=0.9.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
    "scipy>=1.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0"
]

[tool.setuptools.packages.find]
where = ["src"]
